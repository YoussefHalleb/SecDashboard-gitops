apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jury-viewer
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - events
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jury-viewer-binding
  namespace: default
subjects:
  - kind: User
    name: youssefhalleb52@gmail.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jury-viewer
  apiGroup: rbac.authorization.k8s.io
