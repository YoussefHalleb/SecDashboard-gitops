name: Deploy & Auto Rollback

on:
  push:
    branches: [main]

jobs:
  deploy-and-watch:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for ArgoCD sync
        run: sleep 30

      - name: Check app health
        id: check
        run: |
          STATUS=$(curl -sk \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            https://34.78.163.124/api/v1/applications/secdashboard \
            | jq -r '.status.health.status')
          echo "health=$STATUS"
          echo "health=$STATUS" >> $GITHUB_OUTPUT

      - name: Rollback si KO
        if: steps.check.outputs.health != 'Healthy'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert HEAD --no-edit
          git push origin main
          echo "::error::Deploiement KO (${{ steps.check.outputs.health }}) — rollback effectue"
          exit 1

      - name: Deploy success
        if: steps.check.outputs.health == 'Healthy'
        run: echo "Deploiement OK - ${{ github.sha }}"
